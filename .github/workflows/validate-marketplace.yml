name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Both catalogs parse, carry the fields cut-release reads and match the gitlinks and the manifests
        run: |
          node -e '
            const fs = require("fs"), { execFileSync } = require("child_process");
            const pins = {};
            // The Claude desktop app offers an update only when the entry version differs from the installed one.
            const CLAUDE = ".claude-plugin/marketplace.json";
            (async () => {
            for (const catalog of [CLAUDE, ".agents/plugins/marketplace.json"]) {
              const { plugins } = JSON.parse(fs.readFileSync(catalog, "utf8"));
              if (!Array.isArray(plugins) || plugins.length === 0) throw new Error(catalog + ": plugins must be a non-empty list");
              for (const p of plugins) {
                const at = catalog + ", " + p.name + ": ";
                if (catalog !== CLAUDE && "version" in p) throw new Error(at + "the entry carries version " + JSON.stringify(p.version) + "; remove it, because only the Claude Code catalog carries one");
                if (!/^[0-9a-f]{40}$/.test(p.source?.sha)) throw new Error(at + "source.sha is " + JSON.stringify(p.source?.sha) + "; set it to the full commit SHA, 40 lowercase hex characters");
                if (catalog === CLAUDE) {
                  const repo = /^https:\/\/github\.com\/([\w.-]+\/[\w.-]+?)(?:\.git)?$/.exec(p.source.url ?? "")?.[1];
                  if (!repo) throw new Error(at + "source.url is " + JSON.stringify(p.source.url) + "; set it to the plugin repository on github.com, which holds the manifest this check reads");
                  const url = "https://raw.githubusercontent.com/" + repo + "/" + p.source.sha + "/.claude-plugin/plugin.json";
                  const res = await fetch(url);
                  if (!res.ok) throw new Error(at + "cannot read " + url + " (HTTP " + res.status + "); push the pinned commit, or run the check again if GitHub failed");
                  const manifest = JSON.parse(await res.text()).version;
                  if (p.version !== manifest) throw new Error(at + "the entry version is " + JSON.stringify(p.version) + " and the manifest at source.sha says " + JSON.stringify(manifest) + "; set the entry version to the manifest version");
                }
                if (!p.source.ref) throw new Error(at + "source.ref is missing or empty; set it to main, the branch that holds the pinned commit");
                const gitlink = execFileSync("git", ["ls-files", "--stage", "--", String(p.name)], { encoding: "utf8" });
                if (!gitlink.startsWith("160000 ")) throw new Error(at + "the name " + p.name + " is not a submodule path; rename the entry to its submodule path or add the submodule");
                // A Foundry clone checks each plugin out at its gitlink, and Antigravity installs that checkout.
                const linked = gitlink.split(/\s+/)[1];
                if (linked !== p.source.sha) throw new Error(at + "the gitlink " + linked + " differs from source.sha " + p.source.sha + "; move both together");
                if (pins[p.name] && pins[p.name] !== p.source.sha) throw new Error(at + "source.sha " + p.source.sha + " differs from " + pins[p.name] + " in the other catalog; pin the same main commit in both");
                pins[p.name] = p.source.sha;
              }
            }
            console.log("catalogs, gitlinks and versions ok:", Object.keys(pins).join(", "));
            })().catch((error) => { console.error(error.message); process.exit(1); });
          '

      - name: Claude Code accepts the catalog
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.323
          claude plugin validate .
