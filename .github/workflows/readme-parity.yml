name: Coordinate plugin READMEs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readme-parity:
    name: Plugin README parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch both platform branches
        run: |
          plugins=$(node -p "require('./scripts/git-hooks/check-platform-marketplaces').editionPlugins('.').join(' ')")
          for plugin in $plugins; do
            git -C "$plugin" fetch origin "+refs/heads/Claude:refs/remotes/origin/Claude" "+refs/heads/Codex:refs/remotes/origin/Codex"
          done
      - run: node scripts/git-hooks/check-graphic-references.js
      - run: node --test scripts/git-hooks/check-graphic-references.test.js
      - run: node --test scripts/git-hooks/check-readme-parity.test.js
      - name: Compare the committed README pair of each plugin with editions
        run: |
          plugins=$(node -p "require('./scripts/git-hooks/check-platform-marketplaces').editionPlugins('.').join(' ')")
          for plugin in $plugins; do
            node scripts/git-hooks/check-readme-parity.js --git-pair "$plugin" refs/remotes/origin/Claude refs/remotes/origin/Codex
          done
