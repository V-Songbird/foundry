</defs>
<style>.card{fill:#fcfcfb}.ink{fill:#0b0b0b}.mut{fill:#898781}.hi{fill:#fff}.line{fill:none;stroke:#7a4a1e;stroke-width:2;stroke-linecap:round}.shadow{fill:#0b0b0b;opacity:.08}.kb{fill:#4d4d4a}.key{fill:#8a8a85}</style>
