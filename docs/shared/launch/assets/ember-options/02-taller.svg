<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" style="--edge:3.5;--bounce:-1.5px;--swing:5deg;--reach:-26deg" role="img" aria-labelledby="title desc">
<title id="title">Ember artesano: del ruido al resultado</title><desc id="desc">Ilustración conceptual de Hush. Ember trabaja, guarda los registros en un archivo y entrega una respuesta. El detalle sigue disponible. No representa una medición.</desc>
<style>
:root{--paper:#fff;--ink:#252820;--muted:#67716a;--line:#dadfd8;--blue:#2c75a5;--wash:#edf4f7;--warm:#f4f0e8}
@media(prefers-color-scheme:dark){:root{--paper:#191c1b;--ink:#eee9de;--muted:#b5bfb7;--line:#49524b;--blue:#79b6de;--wash:#253740;--warm:#30342e}}
.paper{fill:var(--paper)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.edge{stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round;stroke-width:var(--edge)}.line{stroke:var(--line);fill:none;stroke-width:2}.blue{fill:var(--blue)}.wash{fill:var(--wash)}.warm{fill:var(--warm)}text{font-family:Segoe UI,Arial,sans-serif}.body{fill:#ed9852}.shine{fill:#ffc47c}.flame{fill:#efad50}.mark{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round}
.breath{animation:breathe 10s ease-in-out infinite;transform-origin:390px 268px}.flame-move{animation:flame 10s ease-in-out infinite;transform-origin:0 -77px}.look{animation:look 10s ease-in-out infinite}.noise{opacity:0;animation:noise 10s ease-in-out infinite}.sheet{opacity:0;animation:store 10s ease-in-out infinite}.result{animation:result 10s ease-in-out infinite}.arm{animation:arm 10s ease-in-out infinite;transform-origin:43px 17px}.check{animation:result 10s ease-in-out infinite}.early{opacity:0;animation:noise 10s ease-in-out infinite}.late{animation:result 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}15%,45%{transform:translateY(var(--bounce))}30%,60%,90%{transform:translateY(0)}}
@keyframes flame{0%,25%{transform:rotate(calc(var(--swing) * -1))}12%{transform:rotate(var(--swing))}40%,100%{transform:rotate(0)}}
@keyframes look{0%,22%{transform:translateX(-3px)}35%,100%{transform:translateX(3px)}}
@keyframes noise{0%,5%{opacity:0;transform:translateY(7px)}12%,25%{opacity:1;transform:translateY(0)}38%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes store{0%,20%{opacity:0;transform:translate(0,0)}26%,32%{opacity:1;transform:translate(0,0)}47%{opacity:1;transform:translate(10px,85px)}52%,100%{opacity:0;transform:translate(10px,85px)}}
@keyframes result{0%,52%{opacity:0;transform:translateY(7px)}62%,96%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes arm{0%,28%,100%{transform:rotate(0)}40%,48%{transform:rotate(var(--reach))}62%,90%{transform:rotate(-8deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.noise,.sheet,.early{opacity:0}.result,.check,.late{opacity:1}}
</style>
<rect class="paper" width="820" height="360" rx="20"/>
<text x="30" y="34" class="muted" font-size="12" letter-spacing="2">HUSH / ESTUDIO DE MOVIMIENTO</text>
<path d="M35 284 Q400 280 785 284" class="line"/>
<g class="noise"><rect x="66" y="75" width="194" height="44" rx="16" class="warm"/><path d="M232 116l14 13 -2 -17" class="warm"/><text x="84" y="103" font-size="17" class="ink">Voy a revisar…</text><rect x="109" y="128" width="167" height="40" rx="15" class="warm"/><text x="126" y="154" font-size="17" class="ink">Ahora compruebo…</text></g>
<g transform="translate(107 228)"><path d="M0 3V-9Q0 -14 6 -14H42L53 -5H112Q119 -5 119 3V44Q119 50 112 50H6Q0 50 0 44Z" class="wash" stroke="var(--blue)" stroke-width="2.5"/><path d="M13 6H106" stroke="var(--blue)" stroke-width="2"/><text x="59" y="31" class="ink" text-anchor="middle" font-size="15">Detalle</text></g>
<g class="sheet"><rect x="134" y="129" width="72" height="65" rx="5" class="paper" stroke="var(--blue)" stroke-width="2"/><path d="M147 145h42m-42 12h34m-34 12h39" stroke="var(--blue)" stroke-width="3" stroke-linecap="round"/></g>
<g class="breath"><g transform="translate(390 211)">
<ellipse cx="0" cy="70" rx="85" ry="8" fill="var(--ink)" opacity=".07"/>
<g class="flame-move"><path d="M-22 -76 C-42 -98 -30 -117 -9 -140 C-10 -117 26 -116 24 -93 Q23 -71 -22 -76Z" class="flame edge"/><path d="M-6 -83Q-15 -94 -2 -110Q-3 -96 7 -86" fill="#ffd891"/></g>
<path d="M-81 42 C-90 6 -75 -55 -43 -69 C-13 -83 27 -79 55 -63 C79 -48 90 11 80 43 Q66 69 0 69 Q-66 70 -81 42Z" class="body edge"/>

<path d="M-34 3L-49 56Q0 74 50 56L34 3" fill="var(--wash)" stroke="var(--ink)" stroke-width="3"/><path d="M-33 3L-43 -20M34 3L42 -20" class="mark"/><path d="M-20 32h40v17q-20 10 -40 0Z" fill="none" stroke="var(--blue)" stroke-width="2.5"/>
<g class="look"><ellipse cx="-23" cy="-24" rx="5" ry="7" class="ink"/><ellipse cx="23" cy="-24" rx="5" ry="7" class="ink"/><path d="M-10 -5Q0 4 11 -6" class="mark"/><ellipse cx="-39" cy="-9" rx="9" ry="4" fill="#d66d43" opacity=".5"/><ellipse cx="39" cy="-9" rx="9" ry="4" fill="#d66d43" opacity=".5"/></g>
<path d="M-64 12Q-89 19 -77 33Q-69 39 -56 31" class="body edge"/>
<g class="arm"><path d="M61 12Q91 9 88 23Q88 36 63 34" class="body edge"/></g>
</g></g>
<g class="result"><rect x="527" y="119" width="251" height="134" rx="14" class="wash"/><path d="M547 144l6 6 11 -13" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round"/><text x="574" y="150" class="ink" font-size="21" font-weight="600">Cambio listo.</text><text x="547" y="182" class="ink" font-size="16">Qué cambió y qué sigue.</text><path d="M547 199h210" class="line"/><text x="547" y="226" class="muted" font-size="15">El detalle sigue disponible.</text></g>
<text x="410" y="326" text-anchor="middle" class="muted early" font-size="17">Mucho que leer.</text><text x="410" y="326" text-anchor="middle" class="muted late" font-size="17">Menos ruido. El trabajo a la vista.</text>
</svg>